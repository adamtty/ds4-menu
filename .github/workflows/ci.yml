name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=pypi depName=ruff
  RUFF_VERSION: 0.17.1
  # renovate: datasource=pypi depName=shellcheck-py
  SHELLCHECK_VERSION: 0.11.0.1
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.31.1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: pipx run --spec "shellcheck-py==${SHELLCHECK_VERSION}" shellcheck install.sh menubar/build.sh

      - name: zizmor (workflow security)
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --offline --min-severity low .github/workflows

      - name: ruff
        run: pipx run "ruff==${RUFF_VERSION}" check ds4proxy.py tests/

      - name: Python compiles
        run: python3 -m py_compile ds4proxy.py tests/test_proxy.py tests/fake-ds4-server

  build:
    name: Build app
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      # macOS runners only support audit mode: connections are logged, not blocked
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the same build install.sh does, proxy embedded
      - name: Compile menu bar app
        run: |
          menubar/build.sh "$RUNNER_TEMP/ds4"
          file "$RUNNER_TEMP/ds4"
          codesign --force --options runtime --sign - "$RUNNER_TEMP/ds4"
          codesign --verify --verbose=2 "$RUNNER_TEMP/ds4"

      - name: Compile icon tool
        run: swiftc -o "$RUNNER_TEMP/make-icon" menubar/make-icon.swift

  test:
    name: Proxy tests
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the system Python, which is what the menu bar app runs the proxy with
      - name: Unit and end-to-end tests
        run: /usr/bin/python3 -m unittest discover -s tests -v

  fuzz:
    name: Fuzz
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hypothesis needs 3.11+; the proxy itself runs on the system Python, tested above
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Install pinned, hash-checked dependencies
        run: 'python -m pip install --require-hashes --only-binary :all: -r tests/requirements-fuzz.txt'

      - name: Property-based fuzzing (Hypothesis)
        working-directory: tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: python -m unittest -v test_fuzz

  atheris:
    name: Atheris
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Atheris only ships Linux x86-64 wheels, for CPython 3.12-3.14
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Atheris (hash-checked)
        run: 'python -m pip install --require-hashes --only-binary :all: -r tests/requirements-atheris.txt'

      # coverage-guided fuzzing of request parsing and the gate; slow inputs (over 10 s) fail too
      - name: Fuzz the request handling
        run: |
          mkdir -p "$RUNNER_TEMP/corpus" crashes
          cp tests/fuzz-corpus/http/* "$RUNNER_TEMP/corpus/"
          python tests/fuzz_http.py "$RUNNER_TEMP/corpus" -max_total_time=90 -timeout=10 -artifact_prefix=crashes/

      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atheris-crashes
          path: crashes/
          retention-days: 14
