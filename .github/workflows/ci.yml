name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=pypi depName=ruff
  RUFF_VERSION: 0.17.1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck install.sh

      - name: ruff
        run: pipx run "ruff==${RUFF_VERSION}" check ds4proxy.py tests/

      - name: Python compiles
        run: python3 -m py_compile ds4proxy.py tests/test_proxy.py tests/fake-ds4-server

  build:
    name: Build app
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      # macOS runners only support audit mode: connections are logged, not blocked
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # same flags as install.sh
      - name: Compile menu bar app
        run: |
          swiftc -O -target arm64-apple-macos13 -framework AppKit \
            -o "$RUNNER_TEMP/ds4" menubar/DS4Menu.swift
          file "$RUNNER_TEMP/ds4"

      - name: Compile icon tool
        run: swiftc -o "$RUNNER_TEMP/make-icon" menubar/make-icon.swift

  test:
    name: Proxy tests
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the system Python, which is what the menu bar app runs the proxy with
      - name: Unit and end-to-end tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
