name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly: everything, fuzzing included

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # newest CPython that Atheris publishes wheels for (see the fuzzing job)
  ATHERIS_PYTHON: "3.14"
  # renovate: datasource=pypi depName=ruff
  RUFF_VERSION: 0.17.3
  # renovate: datasource=pypi depName=shellcheck-py
  SHELLCHECK_VERSION: 0.11.0.1
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.31.1

jobs:
  # Which expensive jobs a pull request needs. Fuzzing runs when the code it fuzzes or the fuzz harnesses change,
  # not for dependency or CI version bumps (those are fuzzed on main after merge, and weekly). Pushes, the weekly
  # run and manual runs do everything. If the file list can't be read, everything runs.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # list the pull request's changed files
    outputs:
      fuzz: ${{ steps.files.outputs.fuzz }}
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: What changed
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          FUZZ_PATHS: '^(ds4proxy\.py$|tests/fuzz_|tests/test_fuzz|tests/fuzz-corpus/)'
          DOCS_PATHS: '^(.*\.md|docs/|LICENSE$|\.github/ISSUE_TEMPLATE/)'
        run: |
          everything() {
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ -n "$PR" ] || everything
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)') ||
            { echo "::warning::couldn't list the changed files; running everything"; everything; }
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq "$FUZZ_PATHS"; then fuzz=true; else fuzz=false; fi
          echo "fuzz=$fuzz" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$files" | grep -Evq "$DOCS_PATHS"; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: pipx run --spec "shellcheck-py==${SHELLCHECK_VERSION}" shellcheck install.sh menubar/build.sh

      - name: zizmor (workflow security)
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --offline --min-severity low .github/workflows

      - name: ruff
        run: pipx run "ruff==${RUFF_VERSION}" check ds4proxy.py tests/

      - name: Python compiles
        run: python3 -m py_compile ds4proxy.py tests/test_proxy.py tests/fake-ds4-server

  build:
    name: Build app
    needs: changes
    # skipped only on an explicit "false" (a failed Changes job means run it)
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      # macOS runners only support audit mode: connections are logged, not blocked
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the same build install.sh does, proxy embedded
      - name: Compile menu bar app
        run: |
          menubar/build.sh "$RUNNER_TEMP/ds4"
          file "$RUNNER_TEMP/ds4"
          codesign --force --options runtime --sign - "$RUNNER_TEMP/ds4"
          codesign --verify --verbose=2 "$RUNNER_TEMP/ds4"

      - name: Compile icon tool
        run: swiftc -o "$RUNNER_TEMP/make-icon" menubar/make-icon.swift

  test:
    name: Proxy tests
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the system Python, which is what the menu bar app runs the proxy with
      - name: Unit and end-to-end tests
        run: /usr/bin/python3 -m unittest discover -s tests -v

  fuzz:
    name: Fuzz
    needs: changes
    # skipped only on an explicit "false" (a failed Changes job means run it)
    if: ${{ !cancelled() && needs.changes.outputs.fuzz != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hypothesis needs 3.11+; the proxy itself runs on the system Python, tested above
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install pinned, hash-checked dependencies
        run: 'python -m pip install --require-hashes --only-binary :all: -r tests/requirements-fuzz.txt'

      - name: Property-based fuzzing (Hypothesis)
        working-directory: tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: python -m unittest -v test_fuzz

  atheris:
    name: Atheris
    needs: changes
    # skipped only on an explicit "false" (a failed Changes job means run it)
    if: ${{ !cancelled() && needs.changes.outputs.fuzz != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Atheris only ships Linux x86-64 wheels, for CPython 3.12-3.14 (3.1.0 has none for 3.15). The
      # version is an expression so Renovate leaves it alone: raise it when an Atheris release adds wheels.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.ATHERIS_PYTHON }}

      - name: Install Atheris (hash-checked)
        run: 'python -m pip install --require-hashes --only-binary :all: -r tests/requirements-atheris.txt'

      # coverage-guided fuzzing of request parsing and the gate; slow inputs (over 10 s) fail too
      - name: Fuzz the request handling
        run: |
          mkdir -p "$RUNNER_TEMP/corpus" crashes
          cp tests/fuzz-corpus/http/* "$RUNNER_TEMP/corpus/"
          python tests/fuzz_http.py "$RUNNER_TEMP/corpus" -max_total_time=90 -timeout=10 -artifact_prefix=crashes/

      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atheris-crashes
          path: crashes/
          retention-days: 14
